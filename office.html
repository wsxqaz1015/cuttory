<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>컷토리 업무 오피스</title>
<meta name="description" content="매일 아침 팀원들이 마케팅 트렌드 리포트를 들고 출근하는 작은 픽셀 사무실. 읽고, 퀴즈 풀고, 스크랩하면서 인턴에서 CMO까지 승진해요.">
<meta property="og:title" content="컷토리 업무 오피스">
<meta property="og:description" content="매일 아침 마케팅 트렌드 리포트가 도착하는 작은 사무실">
<meta name="theme-color" content="#161827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="트렌드 오피스">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23161827'/><rect x='3' y='5' width='10' height='8' fill='%23ffb347'/><rect x='5' y='2' width='6' height='3' fill='%23ff6b6b'/></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<script src="config.js"></script>
<style>
@font-face { font-family: 'Pretendard'; src: url('fonts/PretendardVariable.woff2') format('woff2-variations'), url('fonts/PretendardVariable.woff2') format('woff2'); font-weight: 45 920; font-style: normal; font-display: swap; }
:root {
  --bg: #161827; --panel: #222540; --panel-2: #2c3054; --line: #3d4270; --ink: #f2f0ff; --muted: #a3a6cc;
  --accent: #ff6b6b; --gold: #ffc94d; --good: #3ccf91;
  --daily: #ff6b6b; --weekly: #4dabf7; --monthly: #3ccf91; --quarterly: #a98bfa;
  --paper: #fdf8ee; --paper-ink: #22202c; --paper-muted: #6d6879; --paper-line: #e9e0cd; --paper-card: #ffffff;
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: hidden; }
body { background: var(--bg); color: var(--ink); font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", sans-serif; line-height: 1.6; word-break: keep-all; min-height: 100vh; -webkit-text-size-adjust: 100%; }
.px { font-family: "Galmuri11", "Pretendard", monospace; }
button { font: inherit; cursor: pointer; color: inherit; }
a { color: inherit; }
.app { max-width: 1140px; margin: 0 auto; padding: 14px 16px 64px; }

/* 상단 HUD */
.hud { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 12px; }
.hud h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; white-space: nowrap; }
.hud h1 a { text-decoration: none; }
.clock { color: var(--muted); font-size: 13px; white-space: nowrap; }
.spacer { flex: 1; }
.chip-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 6px 11px; font-size: 13.5px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.chip-btn:hover { border-color: var(--accent); }
.chip-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.me-btn { gap: 10px; padding: 5px 12px; }
.me-btn .lv { color: var(--gold); font-size: 13px; }
.me-btn .rk { font-size: 13.5px; }
.xp { display: flex; flex-direction: column; gap: 2px; }
.xpbar { width: 104px; height: 7px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), var(--accent)); transition: width .6s; }
.xptext { font-size: 10.5px; color: var(--muted); font-weight: 600; line-height: 1; }
.streak { font-weight: 800; font-size: 14px; white-space: nowrap; }

/* 사무실 + 옆 패널 */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
.stage { position: relative; background: #0d0e19; border: 3px solid var(--line); border-radius: 12px; overflow: hidden; }
#office { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; cursor: default; touch-action: manipulation; }
#bubbles { position: absolute; inset: 0; pointer-events: none; }
.bubble { position: absolute; transform: translate(-50%, -100%); background: #fff; color: #1d1b2b; font-size: 12px; font-weight: 700; padding: 5px 9px; border-radius: 9px; border: 2px solid #1d1b2b; max-width: 200px; line-height: 1.35; box-shadow: 0 2px 0 rgba(0,0,0,.35); animation: pop .18s ease-out; white-space: normal; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -5px; border: 5px solid transparent; border-top-color: #1d1b2b; border-bottom: 0; }
.bubble.alert { background: var(--gold); }
@keyframes pop { from { transform: translate(-50%, -90%) scale(.85); opacity: 0; } }
.stage-tip { position: absolute; right: 8px; bottom: 8px; font-size: 11.5px; background: rgba(13,14,25,.78); color: #e6e4f5; padding: 3px 9px; border-radius: 7px; pointer-events: none; }
.side { display: grid; gap: 12px; }
.panel { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 12px 12px 10px; }
.panel h2 { font-size: 13px; color: var(--muted); margin: 0 0 8px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
.member { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: var(--panel-2); border: 2px solid transparent; border-radius: 10px; padding: 8px 10px; margin-bottom: 7px; }
.member:hover { border-color: var(--line); }
.member img { width: 36px; height: 54px; image-rendering: pixelated; flex: none; }
.member .nm { font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.member .jb { font-size: 11.5px; color: var(--muted); line-height: 1.4; }
.member .st { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.member .st i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.member.has-new { border-color: var(--gold); }
.team-h { font-size: 12px; font-weight: 800; color: var(--muted); margin: 4px 0 6px; }
#roster-prod { display: grid; grid-template-columns: 1fr 1fr; gap: 0 7px; margin-bottom: 6px; }
#roster-prod .team-h { grid-column: 1 / -1; }
.member.mini { padding: 6px 8px; gap: 7px; }
.member.mini img { width: 24px; height: 36px; }
.member.mini .nm { font-size: 12.5px; gap: 4px; }
.member > span { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
.member.mini .kb { font-size: 9.5px; padding: 0 6px; }
.member.mini .st { font-size: 11px; line-height: 1.35; align-items: flex-start; }
.member.mini .st i { margin-top: 4px; }
.member.todo { border-color: rgba(255,201,77,.35); }
.work-tool { display: flex; gap: 12px; align-items: center; background: #fff; border: 2px solid var(--paper-line); border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
.work-tool .btn { margin-left: auto; flex: none; }
.task { display: flex; gap: 10px; align-items: center; background: #fffbea; border: 2px dashed #f0d98a; border-radius: 12px; padding: 12px 14px; margin: 10px 0; font-weight: 700; }
.task.done { background: #e9faf1; border: 2px solid #9be3c0; }
.task .btn { margin-left: auto; flex: none; }
.src-list { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 6px; }
.src-list li { display: flex; gap: 8px; align-items: center; background: #fff; border: 2px solid var(--paper-line); border-radius: 10px; padding: 8px 10px; font-size: 13px; }
.src-list li span { flex: 1; min-width: 0; }
.src-list li b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src-list .btn { padding: 5px 10px; font-size: 12px; flex: none; }
.kb { display: inline-block; font-size: 10.5px; font-weight: 800; color: #fff; padding: 1px 8px; border-radius: 999px; line-height: 1.6; }
.log { list-style: none; margin: 0; padding: 0; font-size: 12.5px; color: #d5d3ea; max-height: 220px; overflow: auto; }
.log li { padding: 5px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 8px; }
.log li:last-child { border-bottom: 0; }
.log time { color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tools a { font-size: 12px; font-weight: 700; text-decoration: none; background: var(--panel-2); border-radius: 8px; padding: 7px 9px; display: block; }
.tools a:hover { background: var(--line); }

/* 모달 (종이 느낌) */
.modal-bg { position: fixed; inset: 0; background: rgba(8,9,18,.66); display: none; align-items: flex-start; justify-content: center; padding: 26px 12px; overflow-y: auto; z-index: 50; }
.modal-bg.open { display: flex; }
.modal { background: var(--paper); color: var(--paper-ink); width: 100%; max-width: 860px; border-radius: 14px; border: 3px solid #12131f; box-shadow: 0 8px 0 rgba(0,0,0,.35); position: relative; animation: rise .2s ease-out; min-width: 0; overflow-wrap: anywhere; }
.modal.small { max-width: 520px; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
.m-head { display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-bottom: 2px solid var(--paper-line); position: sticky; top: 0; background: var(--paper); border-radius: 12px 12px 0 0; z-index: 2; }
.m-head img { width: 40px; height: 60px; image-rendering: pixelated; flex: none; }
.m-head .say { flex: 1; min-width: 0; }
.m-head .from { font-size: 12px; color: var(--paper-muted); font-weight: 600; }
.m-head .line { font-weight: 800; font-size: 15px; line-height: 1.4; }
.x { background: none; border: 0; font-size: 26px; line-height: 1; color: var(--paper-muted); padding: 4px 8px; border-radius: 8px; }
.x:hover { background: var(--paper-line); }
.m-body { padding: 18px 20px 22px; }
.center { text-align: center; }
.r-period { font-size: 13px; color: var(--paper-muted); font-weight: 600; margin: 6px 0 2px; }
.r-title { font-size: 25px; line-height: 1.32; margin: 2px 0 14px; letter-spacing: -.02em; }
.r-sum { background: #fff; border: 2px solid var(--paper-line); border-radius: 12px; padding: 12px 16px 12px 34px; margin: 0 0 12px; }
.r-sum li { margin: 3px 0; }
.kw { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; }
.kw span, .kw a { font-size: 12px; font-weight: 700; background: #ffe9e3; color: #c4472f; padding: 3px 10px; border-radius: 999px; text-decoration: none; }
.r-sec { margin-top: 26px; }
.r-sec h3 { font-size: 18px; margin: 0 0 2px; }
.r-sec .desc { font-size: 12.5px; color: var(--paper-muted); margin: 0 0 12px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); gap: 12px; }
.cards > * { min-width: 0; }
.card { background: var(--paper-card); border: 2px solid var(--paper-line); border-radius: 12px; padding: 14px 15px 12px; display: flex; flex-direction: column; }
.card.scrapped { border-color: var(--gold); box-shadow: 0 0 0 2px #fff0c2; }
.c-meta { display: flex; align-items: center; gap: 7px; font-size: 12px; margin-bottom: 6px; }
.c-meta .rank { width: 21px; height: 21px; border-radius: 50%; background: var(--paper-ink); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 11.5px; flex: none; }
.c-meta .tag { font-weight: 800; color: #d94a35; }
.c-meta .brand { color: var(--paper-muted); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scrap { margin-left: auto; flex: none; background: #fff; border: 2px solid var(--paper-line); border-radius: 8px; padding: 2px 9px; font-size: 12px; font-weight: 700; color: var(--paper-ink); }
.scrap.on { background: #fff4cf; border-color: var(--gold); }
.card h4 { margin: 0 0 6px; font-size: 15.5px; line-height: 1.4; }
.card p { margin: 0 0 8px; font-size: 14px; color: #3a3746; }
.note { font-size: 13px; border-radius: 9px; padding: 8px 11px; margin: 0 0 7px; line-height: 1.55; }
.note b { display: block; font-size: 11.5px; margin-bottom: 1px; }
.note.why { background: #eef4ff; color: #22396b; }
.note.act { background: #eafaf2; color: #1d5a40; }
.srcs { list-style: none; margin: auto 0 0; padding: 6px 0 0; border-top: 1px dashed var(--paper-line); font-size: 11.5px; color: var(--paper-muted); }
.srcs li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srcs a { color: #4a62b8; }
.memo { background: #fffbea; border: 2px dashed #f0d98a; border-radius: 10px; padding: 9px 10px; margin: 2px 0 8px; }
.memo label { display: block; font-size: 11.5px; font-weight: 800; color: #7a5d0f; margin: 4px 0 2px; }
.memo textarea { width: 100%; font: inherit; font-size: 13px; border: 1.5px solid #eadfb8; border-radius: 7px; padding: 6px 8px; resize: vertical; min-height: 38px; background: #fff; color: var(--paper-ink); }
.memo .done { font-size: 12px; font-weight: 800; color: #1d7a52; margin-top: 4px; }
.memo .grow { font-size: 12.5px; margin-top: 6px; }
.memo .grow li { margin: 2px 0; }
.r-foot { margin-top: 26px; padding-top: 18px; border-top: 2px solid var(--paper-line); text-align: center; }
.follow { text-align: left; background: #fff; border: 2px solid var(--paper-line); border-radius: 12px; padding: 12px 16px; margin: 22px 0 0; }
.follow h3 { margin: 0 0 4px; font-size: 15px; }
.follow ul { margin: 0; padding-left: 20px; font-size: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--paper-ink); color: #fff; border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 800; font-size: 14.5px; text-decoration: none; }
.btn:hover { filter: brightness(1.15); }
.btn.big { padding: 13px 26px; font-size: 16px; }
.btn.ghost { background: #fff; color: var(--paper-ink); border: 2px solid var(--paper-line); }
.btn.gold { background: var(--gold); color: #3b2a05; }
.btn:disabled { opacity: .45; cursor: default; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
.bar.c { justify-content: center; }
.sub { font-size: 12.5px; color: var(--paper-muted); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.tabs button { background: #fff; border: 2px solid var(--paper-line); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; color: var(--paper-ink); }
.tabs button.on { background: var(--paper-ink); border-color: var(--paper-ink); color: #fff; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.list > li > button, .list > li.row { width: 100%; display: flex; gap: 12px; align-items: center; text-align: left; background: #fff; border: 2px solid var(--paper-line); border-radius: 11px; padding: 10px 13px; color: var(--paper-ink); }
.list > li > button:hover { border-color: var(--paper-ink); }
.list > li > button:disabled { opacity: .5; }
.list .ic { font-size: 19px; flex: none; }
.list .t { font-weight: 800; display: block; font-size: 14px; }
.list .h { display: block; font-size: 13px; color: var(--paper-muted); }
.empty { text-align: center; color: var(--paper-muted); padding: 26px 8px; font-size: 14px; }
.field { display: block; font-size: 13px; font-weight: 700; margin: 10px 0 0; text-align: left; }
.field input, .field textarea, .field select, input.search { display: block; width: 100%; margin-top: 4px; font: inherit; font-size: 14.5px; font-weight: 500; padding: 9px 11px; border: 2px solid var(--paper-line); border-radius: 9px; background: #fff; color: var(--paper-ink); }
.field input:focus, .field textarea:focus, input.search:focus { outline: none; border-color: var(--paper-ink); }
.field .opt { font-weight: 500; color: var(--paper-muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.looks { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.looks button { background: #fff; border: 2px solid var(--paper-line); border-radius: 10px; padding: 4px; }
.looks button.on { border-color: var(--paper-ink); box-shadow: 0 0 0 2px var(--gold); }
.looks img { width: 32px; height: 48px; image-rendering: pixelated; display: block; }

/* 퀴즈 */
.qprog { font-size: 12.5px; font-weight: 700; color: var(--paper-muted); }
.qtext { font-size: 18px; font-weight: 800; line-height: 1.45; margin: 6px 0 14px; }
.qopt { display: block; width: 100%; text-align: left; background: #fff; border: 2px solid var(--paper-line); border-radius: 10px; padding: 11px 14px; margin-bottom: 8px; font-size: 14.5px; color: var(--paper-ink); }
.qopt:hover:not(:disabled) { border-color: var(--paper-ink); }
.qopt:disabled { cursor: default; }
.qopt.right { background: #e3f8ec; border-color: #3ccf91; font-weight: 700; }
.qopt.wrong { background: #ffe8e6; border-color: #ff6b6b; }
.qexp { background: #fff; border-radius: 10px; border: 2px solid var(--paper-line); padding: 10px 13px; font-size: 14px; margin: 6px 0 12px; }
.qscore { font-size: 46px; font-weight: 900; margin: 8px 0 0; letter-spacing: -.02em; }
.big-ic { font-size: 54px; line-height: 1.1; margin: 6px 0; }
.levelup h3 { font-size: 22px; margin: 4px 0; }

/* 직급·업적 */
.lvlist { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.lvlist li { display: flex; gap: 12px; align-items: center; background: #fff; border: 2px solid var(--paper-line); border-radius: 10px; padding: 8px 12px; }
.lvlist li.cur { border-color: var(--gold); box-shadow: 0 0 0 2px #ffeaa8; }
.lvlist li.locked { opacity: .55; }
.lvlist .n { font-weight: 800; width: 42px; flex: none; font-size: 12.5px; color: var(--paper-muted); }
.lvlist .tt { font-weight: 800; width: 56px; flex: none; }
.lvlist .u { font-size: 13px; flex: 1; }
.lvlist .u small { display: block; color: var(--paper-muted); }
.lvlist .xpn { font-size: 12px; color: var(--paper-muted); flex: none; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.bdg { background: #fff; border: 2px solid var(--paper-line); border-radius: 12px; padding: 12px 10px; text-align: center; }
.bdg .ic { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 6px; font-size: 26px; border: 3px solid rgba(0,0,0,.12); }
.bdg.off .ic { background: #eee !important; filter: grayscale(1); opacity: .5; }
.bdg b { display: block; font-size: 13.5px; }
.bdg span { display: block; font-size: 11.5px; color: var(--paper-muted); line-height: 1.4; }
.bdg .pg { height: 5px; background: var(--paper-line); border-radius: 3px; margin-top: 7px; overflow: hidden; }
.bdg .pg i { display: block; height: 100%; background: var(--gold); }
.wlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.wlist li { background: #fff; border: 2px solid var(--paper-line); border-radius: 10px; padding: 10px 13px; font-size: 14px; }
.wlist .src { font-size: 11.5px; color: var(--paper-muted); }
.wlist .q { font-weight: 700; }
.wlist details { font-size: 13px; margin-top: 4px; color: #3a3746; }
.promo { display: flex; gap: 12px; align-items: center; background: linear-gradient(90deg, #fff1d6, #ffe4e4); border: 2px solid #ffd59a; border-radius: 12px; padding: 10px 14px; margin: 0 0 12px; font-size: 13.5px; }
.promo b { display: block; }
.promo .btn { margin-left: auto; padding: 7px 12px; font-size: 13px; flex: none; }

/* 리더보드 화면 */
.board-view { position: fixed; inset: 0; background: var(--bg); z-index: 40; overflow-y: auto; }
.bv-wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
.bv-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.bv-head h2 { flex: 1; margin: 0; font-size: 20px; text-align: center; }
.podium { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: end; gap: 10px; margin: 8px 0 18px; }
.pod { text-align: center; }
.pod img { width: 48px; height: 72px; image-rendering: pixelated; }
.pod .blk { background: var(--panel-2); border: 2px solid var(--line); border-radius: 10px 10px 0 0; padding: 8px 4px; }
.pod .nk { font-weight: 800; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pod .meta { font-size: 11.5px; color: var(--muted); }
.pod.p1 .blk { height: 120px; border-color: var(--gold); }
.pod.p2 .blk { height: 92px; }
.pod.p3 .blk { height: 72px; }
.pod .medal { font-size: 22px; }
.rk-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rk-list li { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.rk-list li.me { border-color: var(--gold); }
.rk-list .n { width: 28px; text-align: center; font-weight: 800; color: var(--muted); }
.rk-list .nk { flex: 1; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rk-list .xp2 { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.bv-note { font-size: 13px; color: var(--muted); text-align: center; margin: 14px 0; }

      if (first) { xp = score * 3 + (perfect ? 10 : 0); save.weekRev[w] = { score, total }; } else if (score > save.weekRev[w].score) save.weekRev[w] = { score, total };
      return { line: perfect ? "한 주를 완벽하게 정리하셨어요! 👏" : "좋아요! 틀린 문제는 오답노트에 담았어요.", sub: first ? `<b>+${xp} XP</b>${perfect ? " (만점 보너스 포함)" : ""}` : "다시 풀기는 경험치가 없어요", back: { label: "주간 복습 목록", fn: () => { archTab = "review"; openArchive(); } }, xp, why: `주간 복습 ${score}/${total}` };
    },
  });
}

/* ═════════════ 의견 보내기 ═════════════ */
async function apiToken() {
  let t = store.get("cuttory_token"); if (t) return t;
  const r = await fetch(API + "/api/session", { method: "POST" }), j = await r.json();
  if (!r.ok) throw new Error(j.message || "접속하지 못했어요");
  store.set("cuttory_token", j.token); return j.token;
}
function openFeedback() {
  let kind = "idea";
  openModal(`${head(ME_AV, "고객의 소리", "💬 의견 보내기")}<div class="m-body">
    <p class="sub" style="margin:0 0 10px">불편했던 점, 바라는 기능, 리포트에서 틀린 내용 무엇이든 편하게 남겨 주세요.</p>
    <div class="tabs"><button data-fk="idea" class="on">💡 기능 제안</button><button data-fk="bug">🐛 오류·틀린 내용</button></div>
    <label class="field">내용<textarea id="fb-t" rows="5" maxlength="1800"></textarea></label>
    <div class="bar"><button class="btn" id="fb-send">보내기</button><button class="btn ghost" data-close>취소</button></div></div>`, true);
  modal.querySelectorAll("[data-fk]").forEach(b => b.onclick = () => { kind = b.dataset.fk; modal.querySelectorAll("[data-fk]").forEach(x => x.classList.toggle("on", x === b)); });
  document.getElementById("fb-send").onclick = async e => {
    const text = document.getElementById("fb-t").value.trim(); if (!text) return toast("내용을 적어 주세요");
    if (!API) return toast("서버 주소가 없어요");
    e.target.disabled = true;
    try {
      const send = async () => fetch(API + "/api/feedback", { method: "POST", headers: { authorization: "Bearer " + await apiToken(), "content-type": "application/json" }, body: JSON.stringify({ kind, text: `[트렌드 오피스] ${text}`, ua: navigator.userAgent }) });
      let r = await send(); if (r.status === 401) { store.set("cuttory_token", null); r = await send(); }
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || "보내지 못했어요");
      closeModal(); toast("고마워요! 잘 받았어요 🙏");
    } catch (err) { toast(err.message); e.target.disabled = false; }
  };
}

let tourI = 0;
function startTour() { tourI = 0; document.getElementById("coach").hidden = false; showTour(); }
function endTour() { document.getElementById("coach").hidden = true; save.tour = TOUR_V; persist(); sync(); }
function showTour() {
  const s = TOUR[tourI], spot = document.getElementById("coach-spot"), card = document.getElementById("coach-card");
  const val = v => typeof v === "function" ? v() : v;
  const el = s.sel && document.querySelector(s.sel);
  if (el) el.scrollIntoView({ block: "center", behavior: "instant" });
  const r = el ? el.getBoundingClientRect() : null;
  if (r) Object.assign(spot.style, { display: "block", left: r.left - 6 + "px", top: r.top - 6 + "px", width: r.width + 12 + "px", height: r.height + 12 + "px" });
  else Object.assign(spot.style, { display: "block", left: "50%", top: "45%", width: "0px", height: "0px" });
  card.innerHTML = `<h4>${val(s.title)}</h4><p>${val(s.text)}</p><div class="bar"><span class="stp">${tourI + 1} / ${TOUR.length}</span>${tourI ? `<button class="btn ghost" id="tr-prev">이전</button>` : `<button class="btn ghost" id="tr-skip">건너뛰기</button>`}<button class="btn" id="tr-next">${tourI === TOUR.length - 1 ? "시작하기" : "다음"}</button></div>`;
  const cw = card.offsetWidth, ch = card.offsetHeight, vw = innerWidth, vh = innerHeight;
  let top = r ? (r.bottom + 14 + ch < vh ? r.bottom + 14 : Math.max(12, r.top - ch - 14)) : vh / 2 - ch / 2;
  let left = r ? Math.min(Math.max(12, r.left), vw - cw - 12) : vw / 2 - cw / 2;
  if (r && r.height > vh * .55) { top = Math.min(vh - ch - 12, r.top + 20); left = Math.min(Math.max(12, r.left + 20), vw - cw - 12); }
  Object.assign(card.style, { top: top + "px", left: left + "px" });
  const nx = document.getElementById("tr-next"), pv = document.getElementById("tr-prev"), sk = document.getElementById("tr-skip");
  nx.onclick = () => { if (tourI === TOUR.length - 1) endTour(); else { tourI++; showTour(); } };
  if (pv) pv.onclick = () => { tourI--; showTour(); };
  if (sk) sk.onclick = endTour;
}
addEventListener("resize", () => { if (!document.getElementById("coach").hidden) showTour(); });
