name = "cuttory-api"
main = "worker.js"
compatibility_date = "2026-10-01"

# Cloudflare 대시보드에서 KV 네임스페이스를 만든 뒤 id를 넣어요.
[[kv_namespaces]]
binding = "KV"
id = "여기에_KV_ID"

[vars]
ALLOWED_ORIGIN = "https://wsxqaz1015.github.io"
# TEXT_MODEL = "gpt-4o-mini"
# IMAGE_MODEL = "gpt-image-1"
# STT_MODEL = "whisper-1"
# 구글 로그인: 구글 클라우드 콘솔에서 만든 "웹 애플리케이션" 클라이언트 ID
# GOOGLE_CLIENT_ID = "1234-abcd.apps.googleusercontent.com"

# 비밀 값은 파일에 적지 말고 이렇게 넣어요:
#   npx wrangler secret put OPENAI_API_KEY
#   npx wrangler secret put ADMIN_KEY
