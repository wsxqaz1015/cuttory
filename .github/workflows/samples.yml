name: 샘플 사진 그리기
on:
  workflow_dispatch:
    inputs:
      redraw:
        description: '있는 사진도 다시 그리기'
        default: ''
  push:
    branches: [main]
    paths: ['samples/prompts.json']
permissions:
  contents: write
jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GPT로 샘플 사진 그리기
        env:
          API: https://cuttory-api.wsxqaz1015.workers.dev
          REDRAW: ${{ inputs.redraw }}
        run: |
          node - <<'JS'
          const fs = require('fs');
          const prompts = JSON.parse(fs.readFileSync('samples/prompts.json', 'utf8'));
          const API = process.env.API;
          let token = '', credits = 0; const log = [];
          async function session() {
            const r = await fetch(API + '/api/session', { method: 'POST' });
            const j = await r.json(); if (!r.ok) throw new Error('session: ' + JSON.stringify(j));
            token = j.token; credits = j.credits;
          }
          (async () => {
            try { log.push('models: ' + JSON.stringify(await (await fetch(API + '/api/models')).json())); } catch (e) { log.push('models: ' + e.message); }
            for (const [k, p] of Object.entries(prompts)) {
              if (fs.existsSync(`samples/${k}.jpg`) && !process.env.REDRAW) { log.push(`${k}: skip`); continue; }
              if (credits < 20) await session();
              const prompt = `Casual unedited smartphone snapshot, the kind people post to Instagram stories. Everyday real moment, imperfect framing, natural phone camera look with slight noise, ordinary colors, sometimes direct flash or wide-angle distortion. It must NOT look like a professional, editorial, cinematic, studio or AI photo: no dramatic lighting, no heavy background blur, no color grading, no glossy or airbrushed skin. If a style note follows, keep this phone snapshot look anyway. Scene: ${p}. Any person is fictional, not a real or famous person.`;
              const r = await fetch(API + '/api/image', { method: 'POST', headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' }, body: JSON.stringify({ prompt, style: 'photo' }) });
              const j = await r.json();
              if (!r.ok) { log.push(`${k}: ${r.status} ${JSON.stringify(j)}`); continue; }
              credits = j.credits;
              fs.writeFileSync(`samples/${k}.png`, Buffer.from(j.image.split(',')[1], 'base64'));
              log.push(`${k}: ok`);
            }
          })().catch(e => log.push('error: ' + e.message)).finally(() => fs.writeFileSync('samples/log.txt', new Date().toISOString() + '\n' + log.join('\n') + '\n'));
          JS
      - name: 사진 줄이기
        run: |
          pip install -q pillow
          python3 -c "exec('import glob,os\\nfrom PIL import Image\\nfor f in glob.glob(\\'samples/*.png\\'):\\n im=Image.open(f).convert(\\'RGB\\');w,h=im.size;im.resize((900,round(h*900/w))).save(f[:-4]+\\'.jpg\\',quality=82);os.remove(f)')"
          ls -la samples
      - name: 저장소에 넣기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples
          git commit -m "GPT로 그린 샘플 사진" || echo "바뀐 사진 없음"
          git push
