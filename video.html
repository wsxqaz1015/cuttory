<script>
const API = window.CUTTORY_API || '';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2400); }
const won = n => (Math.round(+n || 0)).toLocaleString() + '원';

const H = {
  token: store.get('cuttory_token') || '',
  async session() {
    if (this.token) return this.token;
    const r = await fetch(API + '/api/session', { method: 'POST' }); const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.message || '접속하지 못했어요.');
    this.token = j.token; store.set('cuttory_token', j.token); this.credits(j.credits); return j.token;
  },
  async call(path, body, retry = true) {
    if (!API) throw new Error('서버 주소가 없어요.');
    const tok = await this.session();
    const r = await fetch(API + path, { method: 'POST', headers: { authorization: 'Bearer ' + tok, 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401 && retry) { this.token = ''; store.set('cuttory_token', null); return this.call(path, body, false); }
    this.credits(j.credits);
    if (!r.ok) throw new Error(j.message || '서버가 제대로 답하지 못했어요.');
    return j;
  },
  credits(n) { if (n != null) $('#credits').textContent = '✨ ' + Number(n).toLocaleString(); },
};

/* ===== 저장: 의뢰 여러 개 + 가격표 ===== */
const KEY = 'cuttory-video-v1';
const PRICE0 = {
  packages: [
    { id: 'basic', name: '베이직', price: 39000, scope: '15초 · 장면 4개 · 자막 · 수정 1회 · 3일' },
    { id: 'std', name: '스탠다드', price: 69000, scope: '30초 · 장면 6~8개 · 자막·BGM · 수정 2회 · 4일' },
    { id: 'pro', name: '프리미엄', price: 120000, scope: '60초 · 장면 10개+ · 모델·나레이션 · 수정 2회 · 5일' },
  ],
  extras: [
    { id: 'rev', name: '추가 수정 (문구·색·위치)', price: 5000 },
    { id: 'ratio', name: '다른 비율 추가 (1:1 · 16:9)', price: 10000 },
    { id: 'src', name: '원본 프로젝트 · 소스 파일', price: 20000 },
    { id: 'rush', name: '급행 (24시간)', price: 20000 },
    { id: 'voice', name: 'AI 나레이션', price: 15000 },
  ],
};
let D = store.get(KEY) || {};
D.price = D.price || JSON.parse(JSON.stringify(PRICE0));
D.list = D.list || [];
const newProj = () => ({ id: Date.now().toString(36), b: { use: '인스타 릴스 광고', len: '15', how: 'photo' }, imgs: [], plan: null, pick: 0, pkg: 'basic', ex: {}, done: {} });
if (!D.list.length) D.list.push(newProj());
D.cur = D.list.some(p => p.id === D.cur) ? D.cur : D.list[0].id;
const P = () => D.list.find(p => p.id === D.cur);
let saveT; const persist = () => { clearTimeout(saveT); saveT = setTimeout(() => { if (!store.set(KEY, D)) toast('저장 공간이 꽉 찼어요. 지난 의뢰를 지워 주세요'); }, 250); };

function renderProjects() {
  $('#projects').innerHTML = D.list.map(p => `<button data-p="${p.id}" class="${p.id === D.cur ? 'on' : ''}">${esc(p.b.client || p.b.product || '새 의뢰')}</button>`).join('') + '<button data-p="+">＋ 새 의뢰</button>' + (D.list.length > 1 ? '<button data-p="-">🗑 이 의뢰 지우기</button>' : '');
  $$('[data-p]').forEach(b => b.onclick = () => {
    const v = b.dataset.p;
    if (v === '+') { const n = newProj(); D.list.unshift(n); D.cur = n.id; }
    else if (v === '-') { if (!confirm('이 의뢰를 지울까요?')) return; D.list = D.list.filter(p => p.id !== D.cur); D.cur = D.list[0].id; }
    else D.cur = v;
    D.list = D.list.slice(0, 20); persist(); load();
  });
}
const BF = ['client', 'product', 'mood', 'must'];
function load() {
  const p = P();
  BF.forEach(k => { const el = $('#b-' + k); el.value = p.b[k] || ''; el.oninput = () => { p.b[k] = el.value; persist(); if (k === 'client' || k === 'product') renderProjects(); }; });
  $$('.seg[data-k]').forEach(g => {
    const k = g.dataset.k;
    g.querySelectorAll('button').forEach(b => { b.classList.toggle('on', b.dataset.v === String(p.b[k])); b.onclick = () => { p.b[k] = b.dataset.v; persist(); load(); }; });
  });
  if (p.b.len === '60' && p.pkg === 'basic') p.pkg = 'pro';
  renderThumbs(); renderProjects(); renderPane();
}
function renderThumbs() {
  const p = P();
  $('#thumbs').innerHTML = p.imgs.map((u, i) => `<div><img src="${u}" alt=""><button data-x="${i}" aria-label="빼기">✕</button></div>`).join('');
  $$('[data-x]').forEach(b => b.onclick = () => { p.imgs.splice(+b.dataset.x, 1); persist(); renderThumbs(); });
}
async function shrink(file, max = 768, q = .8) {
  const img = await new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = rej; im.src = u; });
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', q);
}
$('#b-imgs').onchange = async e => {
  const p = P(), files = [...e.target.files]; e.target.value = '';
  for (const f of files) { if (p.imgs.length >= 4) { toast('사진은 4장까지예요'); break; } p.imgs.push(await shrink(f)); }
  persist(); renderThumbs();
};

/* ===== 가격표 ===== */
function renderPrice() {
  const pr = D.price;
  $('#price-edit').innerHTML = pr.packages.map((k, i) => `<div class="two" style="grid-template-columns:1fr 110px;margin-top:8px"><input type="text" data-pk="${i}" data-f="scope" value="${esc(k.scope)}" aria-label="${esc(k.name)} 범위"><input type="number" data-pk="${i}" data-f="price" value="${k.price}" aria-label="${esc(k.name)} 가격"></div><small style="color:var(--ct-sub);font-size:12px">${esc(k.name)}</small>`).join('')
    + '<label class="f">추가 옵션</label>' + pr.extras.map((x, i) => `<div class="two" style="grid-template-columns:1fr 110px;margin-top:6px"><input type="text" data-ex="${i}" data-f="name" value="${esc(x.name)}"><input type="number" data-ex="${i}" data-f="price" value="${x.price}"></div>`).join('');
  $$('#price-edit input').forEach(el => el.oninput = () => {
    const arr = el.dataset.pk != null ? pr.packages[+el.dataset.pk] : pr.extras[+el.dataset.ex];
    arr[el.dataset.f] = el.type === 'number' ? +el.value || 0 : el.value; persist(); if (tab === 'quote') renderPane();
  });
}
$('#price-reset').onclick = () => { if (!confirm('가격표를 기본값으로 되돌릴까요?')) return; D.price = JSON.parse(JSON.stringify(PRICE0)); persist(); renderPrice(); renderPane(); };

/* ===== AI 기획 ===== */
const HOW = { photo: '고객 제품 사진을 이미지→영상(image-to-video) AI로 움직이게 만들고 편집', full: '장면을 텍스트→이미지→영상 AI로 전부 생성하고 편집', edit: '고객이 준 촬영 영상을 편집 (부족한 컷만 AI로 보충)' };
$('#go').onclick = async e => {
  const p = P(), b = p.b;
  if (!b.product && !b.client) return toast('고객이나 제품을 적어 주세요');
  const btn = e.currentTarget; btn.disabled = true; btn.textContent = '기획하는 중… (30초쯤)';
  const prompt = `너는 1인 브랜드의 숏폼 광고 영상을 외주로 만드는 AI 영상 크리에이터의 기획 비서야.
의뢰:
- 고객/브랜드: ${b.client || '-'}
- 제품/서비스: ${b.product || '-'}
- 용도: ${b.use} / 길이: ${b.len}초 / 세로 9:16
- 제작 방식: ${HOW[b.how]}
- 분위기·레퍼런스: ${b.mood || '-'}
- 꼭 들어갈 문구·정보: ${b.must || '-'}
${p.imgs.length ? `- 첨부 사진 ${p.imgs.length}장: 제품의 색, 재질, 모양, 패키지 문구를 보고 장면에 그대로 반영해. 사진에 없는 제품 디테일은 지어내지 마.` : ''}

규칙:
- 첫 1.5초 안에 멈추게 하는 훅이 핵심이야. 서로 다른 유형(질문형·결과 먼저 보여주기형·공감형·반전형 등)으로 훅 3개를 쓰고, 가장 좋은 것 하나를 골라 이유를 적어.
- 장면 수는 길이에 맞게 (8초 3개, 15초 4~5개, 30초 6~8개, 60초 10~12개). 각 장면 초 단위 구간을 적어.
- image_prompt/video_prompt는 영어로, Kling·Runway·Midjourney에 바로 붙여 넣을 수 있게 구체적으로 (subject, setting, lighting, camera movement, lens, mood, 9:16 vertical). 제품 사진을 쓰는 장면은 "use the uploaded product photo as the first frame"을 넣어.
- tool은 그 장면에 맞는 도구 하나 (Kling, Runway, Midjourney, 캡컷, 고객 영상 중).
- 화면 자막은 한 줄 14자 이내 한국어.
- 꼭 들어갈 정보는 반드시 장면 어딘가에 넣어.
JSON:
{"concept_title": "콘셉트 한 줄, 핵심 단어 하나를 [대괄호]로", "concept": "2문장 설명", "hooks": [{"type": "", "text": "화면 첫 자막/첫 대사", "why": ""}], "best_hook": 0, "best_reason": "",
"scenes": [{"sec": "0-1.5", "shot": "무엇을 보여주는지 한국어 한 줄", "onscreen": "화면 자막", "voice": "나레이션 (없으면 빈칸)", "tool": "", "image_prompt": "", "video_prompt": "", "camera": "카메라 움직임 한국어"}],
"bgm_prompt": "Suno에 넣을 영어 BGM 프롬프트 (장르, BPM, 악기, 분위기, instrumental)", "edit_steps": ["캡컷 편집 순서 6~9단계, 구체적으로 (컷 길이, 전환, 자막 스타일, 효과음 위치)"],
"caption": "인스타 캡션 3~5줄 + 행동 유도", "hashtags": ["10개 이내"], "ask_client": ["고객에게 더 받아야 할 자료나 확인할 점 3~5개"], "risk": ["AI로 만들 때 주의할 점 2~3개 (제품 왜곡, 손·글자 깨짐, 음원 저작권 등)"]}`;
  try {
    const j = await H.call('/api/ai', { kind: 'gen', json: true, prompt, images: p.imgs });
    p.plan = j.json || null; p.pick = Math.max(0, Math.min(2, +(p.plan && p.plan.best_hook) || 0));
    persist(); tab = 'plan'; renderPane(); toast('기획이 나왔어요!');
    if (innerWidth < 960) $('#out').scrollIntoView({ behavior: 'smooth' });
  } catch (err) { toast(err.message); }
  btn.disabled = false; btn.textContent = '🎬 기획 만들기';
};

/* ===== 결과 화면 ===== */
let tab = 'plan';
$$('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; renderPane(); });
const hl = s => esc(s).replace(/\[(.+?)\]/g, '<em>$1</em>');
const copyBtn = (text, label) => `<div class="prompt"><span class="lb">${esc(label)}</span>${esc(text)}<button data-copy="${esc(text)}">복사</button></div>`;
function renderPane() {
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  const p = P(), L = p.plan, el = $('#pane');
  if (tab !== 'quote' && !L) { el.innerHTML = `<div class="empty"><div class="ic">🎬</div><b>여기에 기획이 나와요</b><p>왼쪽에 의뢰 내용을 적고 아래 <b>기획 만들기</b>를 눌러 주세요.<br>견적은 기획 없이도 바로 볼 수 있어요.</p></div>`; return; }
  if (tab === 'plan') {
    el.innerHTML = `<div class="concept"><h3>${hl(L.concept_title || '')}</h3><p>${esc(L.concept || '')}</p></div>
      <h4 class="sec">훅 3개 · 눌러서 고르기</h4><div class="hooks">${(L.hooks || []).map((h, i) => `<button class="hook ${i === p.pick ? 'on' : ''}" data-h="${i}">${i === +L.best_hook ? '<span class="pick">추천</span>' : ''}<span class="tp">${esc(h.type)}</span><span class="tx">${esc(h.text)}</span><span class="wy">${esc(h.why)}</span></button>`).join('')}</div>
      ${L.best_reason ? `<p class="note">추천 이유: ${esc(L.best_reason)}</p>` : ''}
      <h4 class="sec">장면 흐름</h4><ol class="steps">${(L.scenes || []).map(s => `<li><b>${esc(s.sec)}초</b> ${esc(s.shot)}${s.onscreen ? ` · <i>"${esc(s.onscreen)}"</i>` : ''}</li>`).join('')}</ol>
      ${(L.ask_client || []).length ? `<h4 class="sec">고객에게 더 받을 것</h4><ul class="check">${L.ask_client.map(x => `<li>• ${esc(x)}</li>`).join('')}</ul>` : ''}`;
    $$('[data-h]').forEach(b => b.onclick = () => { p.pick = +b.dataset.h; persist(); renderPane(); });
  } else if (tab === 'prompts') {
    const hook = (L.hooks || [])[p.pick];
    el.innerHTML = `${hook ? `<p class="note" style="margin:0 0 10px">첫 장면 자막은 고른 훅 <b>"${esc(hook.text)}"</b>로 바꿔 쓰세요.</p>` : ''}
      <div class="scenes">${(L.scenes || []).map((s, i) => `<div class="scene"><div class="top"><span class="no">${i + 1}</span><span class="sec">${esc(s.sec)}초</span><span class="tool">${esc(s.tool)}</span></div>
        <div class="shot">${esc(s.shot)}</div>
        <dl class="kv">${s.onscreen || (i === 0 && hook) ? `<dt>자막</dt><dd>${esc(i === 0 && hook ? hook.text : s.onscreen)}</dd>` : ''}${s.voice ? `<dt>나레이션</dt><dd>${esc(s.voice)}</dd>` : ''}${s.camera ? `<dt>카메라</dt><dd>${esc(s.camera)}</dd>` : ''}</dl>
        ${s.image_prompt ? copyBtn(s.image_prompt, '이미지 프롬프트') : ''}${s.video_prompt ? copyBtn(s.video_prompt, '영상 프롬프트') : ''}</div>`).join('')}</div>
      ${L.bgm_prompt ? `<h4 class="sec">BGM (Suno)</h4>${copyBtn(L.bgm_prompt, 'Suno 프롬프트')}` : ''}
      ${(L.risk || []).length ? `<h4 class="sec">만들 때 주의</h4><ul class="check">${L.risk.map(x => `<li>⚠️ ${esc(x)}</li>`).join('')}</ul>` : ''}`;
  } else if (tab === 'edit') {
    const tags = (L.hashtags || []).map(t => t.startsWith('#') ? t : '#' + t).join(' ');
    el.innerHTML = `<h4 class="sec" style="margin-top:0">캡컷 편집 순서</h4><ol class="steps">${(L.edit_steps || []).map(s => `<li>${esc(s)}</li>`).join('')}</ol>
      <h4 class="sec">업로드 캡션</h4><div class="cap">${esc(L.caption || '')}${tags ? '\n\n' + esc(tags) : ''}</div>
      <div class="row"><button class="btn dark sm" data-copy="${esc((L.caption || '') + (tags ? '\n\n' + tags : ''))}">캡션 복사</button><a class="btn sm" href="reels.html">릴스 도구에서 헤드카피 얹기 →</a></div>`;
  } else {
    renderQuote(el, p);
  }
  $$('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); toast('복사했어요'); } catch { toast('복사하지 못했어요'); } });
}
function renderQuote(el, p) {
  const pr = D.price, pk = pr.packages.find(k => k.id === p.pkg) || pr.packages[0];
  const ex = pr.extras.filter(x => p.ex[x.id]);
  const total = pk.price + ex.reduce((n, x) => n + x.price * (p.ex[x.id] || 0), 0);
  const b = p.b, L = p.plan;
  const msg = `안녕하세요, ${b.client || '고객'}님 😊
${b.product ? `${b.product} ` : ''}${b.use} 영상(${b.len}초, 9:16) 견적 보내드려요.

▪︎ ${pk.name}: ${won(pk.price)}
  ${pk.scope}
${ex.map(x => `▪︎ ${x.name}${(p.ex[x.id] || 0) > 1 ? ' ×' + p.ex[x.id] : ''}: ${won(x.price * p.ex[x.id])}`).join('\n')}${ex.length ? '\n' : ''}
합계 ${won(total)}

${L && L.concept_title ? `제안 콘셉트: ${L.concept_title.replace(/[\[\]]/g, '')}\n${L.concept || ''}\n\n` : ''}진행 순서: 상담·레퍼런스 확인 → 결제 → 시안 → 수정 → 최종 파일 전달
수정은 한 번에 모아서 보내주셔야 1회로 쳐요. 배경·콘셉트를 새로 바꾸는 수정은 해당 컷 금액의 50%가 추가돼요.
준비해 주실 것: 제품 사진(정면·디테일), 원하는 분위기 레퍼런스, 꼭 들어갈 문구${L && (L.ask_client || []).length ? '\n' + L.ask_client.map(x => '· ' + x).join('\n') : ''}`;
  const DEL = ['1080×1920 세로, 30fps 이상으로 내보내기', '자막 오타 · 제품명 · 가격 다시 확인', '제품 모양·글자가 AI로 깨진 장면 없는지 확인', 'BGM · 효과음 상업 사용 가능한지 확인', '썸네일(커버) 1장 같이 전달', '수정 횟수 · 남은 횟수 안내', '원본 파일 제공 여부 계약대로'];
  el.innerHTML = `<h4 class="sec" style="margin-top:0">패키지</h4><div class="pk">${pr.packages.map(k => `<button data-pk="${k.id}" class="${k.id === pk.id ? 'on' : ''}"><b>${esc(k.name)}</b><span class="pr">${won(k.price)}</span><small>${esc(k.scope)}</small></button>`).join('')}</div>
    <div class="opts">${pr.extras.map(x => `<label><input type="checkbox" data-ex="${x.id}" ${p.ex[x.id] ? 'checked' : ''}>${esc(x.name)}${x.id === 'rev' && p.ex.rev ? ` <input type="number" min="1" max="9" value="${p.ex.rev}" data-exn="rev" style="width:56px;padding:4px 6px">회` : ''}<span>+${won(x.price)}</span></label>`).join('')}</div>
    <table class="qt" style="margin-top:12px"><tr><td>${esc(pk.name)}<small>${esc(pk.scope)}</small></td><td>${won(pk.price)}</td></tr>${ex.map(x => `<tr><td>${esc(x.name)}${(p.ex[x.id] || 0) > 1 ? ' ×' + p.ex[x.id] : ''}</td><td>${won(x.price * p.ex[x.id])}</td></tr>`).join('')}<tr class="total"><td>합계</td><td>${won(total)}</td></tr></table>
    <h4 class="sec">고객에게 보낼 견적 메시지</h4><div class="msg">${esc(msg)}</div>
    <div class="row"><button class="btn dark sm" data-copy="${esc(msg)}">메시지 복사</button><a class="btn sm" href="portfolio.html">포트폴리오에 작업물 올리기 →</a></div>
    <h4 class="sec">납품 전 체크</h4><ul class="check">${DEL.map((x, i) => `<li><label><input type="checkbox" data-done="${i}" ${p.done[i] ? 'checked' : ''}>${esc(x)}</label></li>`).join('')}</ul>`;
  $$('[data-pk]').forEach(b => b.onclick = () => { p.pkg = b.dataset.pk; persist(); renderPane(); });
  $$('[data-ex]').forEach(c => c.onchange = () => { p.ex[c.dataset.ex] = c.checked ? 1 : 0; persist(); renderPane(); });
  $$('[data-exn]').forEach(c => c.onchange = () => { p.ex[c.dataset.exn] = Math.max(1, Math.min(9, +c.value || 1)); persist(); renderPane(); });
  $$('[data-done]').forEach(c => c.onchange = () => { p.done[c.dataset.done] = c.checked; persist(); });
}

renderPrice(); load();
</script>
